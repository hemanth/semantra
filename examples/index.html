<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>semantra — Semantic Search Demo</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: rgba(255, 255, 255, 0.04);
      --surface-hover: rgba(255, 255, 255, 0.08);
      --border: rgba(255, 255, 255, 0.08);
      --text: #e8e8ed;
      --text-dim: #8888a0;
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.25);
      --green: #22c55e;
      --radius: 16px;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 20px;
      overflow-x: hidden;
    }

    /* Ambient gradient */
    body::before {
      content: '';
      position: fixed;
      top: -40%;
      left: 50%;
      transform: translateX(-50%);
      width: 800px;
      height: 800px;
      background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      width: 100%;
      max-width: 640px;
      position: relative;
      z-index: 1;
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 48px;
    }

    .logo {
      font-size: 2.4rem;
      font-weight: 700;
      background: linear-gradient(135deg, #818cf8, #6366f1, #4f46e5);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.03em;
    }

    .tagline {
      color: var(--text-dim);
      font-size: 0.95rem;
      margin-top: 8px;
    }

    /* Search input */
    .search-wrapper {
      position: relative;
      margin-bottom: 32px;
    }

    .search-input {
      width: 100%;
      padding: 16px 20px 16px 48px;
      font-size: 1rem;
      font-family: inherit;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .search-input::placeholder { color: var(--text-dim); }

    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      width: 20px;
      height: 20px;
      color: var(--text-dim);
    }

    /* Status bar */
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      color: var(--text-dim);
      margin-bottom: 24px;
      min-height: 24px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-dim);
      transition: background 0.3s;
    }

    .status-dot.ready { background: var(--green); }
    .status-dot.loading {
      background: var(--accent);
      animation: pulse 1.2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* Results */
    .results {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .result-card {
      padding: 16px 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      transition: background 0.2s, border-color 0.2s, transform 0.2s;
      cursor: default;
      animation: fadeIn 0.25s ease-out;
    }

    .result-card:hover {
      background: var(--surface-hover);
      border-color: rgba(255, 255, 255, 0.12);
      transform: translateY(-1px);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .result-score {
      font-size: 0.78rem;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 100px;
      background: var(--accent-glow);
      color: #a5b4fc;
      letter-spacing: 0.02em;
    }

    .result-index {
      font-size: 0.75rem;
      color: var(--text-dim);
    }

    .result-text {
      font-size: 0.95rem;
      line-height: 1.5;
      color: var(--text);
    }

    .empty {
      text-align: center;
      color: var(--text-dim);
      font-size: 0.9rem;
      padding: 40px;
    }

    /* Progress bar */
    .progress-bar {
      height: 3px;
      background: var(--border);
      border-radius: 2px;
      margin-bottom: 24px;
      overflow: hidden;
      display: none;
    }

    .progress-bar.active { display: block; }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), #818cf8);
      border-radius: 2px;
      transition: width 0.3s ease;
      width: 0%;
    }

    /* Code snippet */
    .code-snippet {
      margin-top: 48px;
      padding: 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 0.82rem;
      line-height: 1.6;
      color: var(--text-dim);
      overflow-x: auto;
    }

    .code-snippet .kw { color: #c084fc; }
    .code-snippet .fn { color: #818cf8; }
    .code-snippet .str { color: #34d399; }
    .code-snippet .cm { color: #555570; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">semantra</div>
      <div class="tagline">Semantic vector search, entirely in the browser</div>
    </div>

    <div class="search-wrapper">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/>
        <path d="m21 21-4.35-4.35"/>
      </svg>
      <input id="search" class="search-input" type="text" placeholder="Search by meaning..." autocomplete="off">
    </div>

    <div id="progress" class="progress-bar">
      <div id="progressFill" class="progress-fill"></div>
    </div>

    <div id="status" class="status">
      <div id="statusDot" class="status-dot"></div>
      <span id="statusText">Initializing...</span>
    </div>

    <div id="results" class="results"></div>

    <div class="code-snippet">
      <span class="kw">import</span> { <span class="fn">search</span> } <span class="kw">from</span> <span class="str">'semantra'</span>;<br><br>
      <span class="kw">const</span> results = <span class="kw">await</span> <span class="fn">search</span>(<span class="str">'forgot password'</span>, docs);<br>
      <span class="cm">// → [{ text: 'How to reset your password', score: 0.88 }]</span>
    </div>
  </div>

  <script type="module">
    // FAQ corpus — 30 sample entries
    const faq = [
      "How to reset your password",
      "I forgot my login credentials",
      "Track the status of your delivery",
      "Where is my package? Shipping and tracking help",
      "Update your billing address and payment method",
      "How to change your credit card on file",
      "Cancel your subscription or membership",
      "How to get a refund for your purchase",
      "Return policy and how to return items",
      "Contact customer support by phone or chat",
      "Enable two-factor authentication for security",
      "How to delete or deactivate your account",
      "Change your email address or username",
      "How to upgrade to a premium plan",
      "Download your invoice or receipt",
      "Set up notifications and email preferences",
      "How to use promo codes and discounts",
      "Report a bug or technical issue",
      "System requirements and browser compatibility",
      "How to export or download your data",
      "Privacy settings and data protection",
      "How to share your account with family members",
      "Troubleshoot login issues and locked accounts",
      "How to connect third-party integrations",
      "Mobile app download and installation guide",
      "How to customize your dashboard and profile",
      "Frequently asked questions about free trials",
      "How to schedule a demo or consultation",
      "Enterprise pricing and volume discounts",
      "API documentation and developer resources",
    ];

    const searchInput = document.getElementById('search');
    const resultsDiv = document.getElementById('results');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const progressBar = document.getElementById('progress');
    const progressFill = document.getElementById('progressFill');

    let searchFn = null;
    let debounceTimer = null;

    // Dynamic import of semantra
    async function init() {
      try {
        statusDot.className = 'status-dot loading';
        statusText.textContent = 'Loading model (~30 MB, one-time)...';
        progressBar.classList.add('active');

        // Import semantra — in production this would be from 'semantra'
        // For the demo, we'll simulate with a local import
        const { search: semantraSearch } = await import('../src/index.ts');

        searchFn = semantraSearch;

        // Warm up — trigger model download by doing a dummy search
        await semantraSearch('test', faq.slice(0, 1), { topK: 1 });

        statusDot.className = 'status-dot ready';
        statusText.textContent = `Ready — ${faq.length} documents indexed`;
        progressBar.classList.remove('active');
        searchInput.focus();
      } catch (err) {
        statusDot.className = 'status-dot';
        statusText.textContent = `Error: ${err.message}`;
        progressBar.classList.remove('active');
        console.error(err);
      }
    }

    // Search handler with debounce
    searchInput.addEventListener('input', (e) => {
      clearTimeout(debounceTimer);
      const query = e.target.value.trim();

      if (!query) {
        resultsDiv.innerHTML = '<div class="empty">Type to search by meaning, not just keywords</div>';
        return;
      }

      if (!searchFn) return;

      debounceTimer = setTimeout(async () => {
        try {
          const results = await searchFn(query, faq, { topK: 5, threshold: 0.15 });

          if (results.length === 0) {
            resultsDiv.innerHTML = '<div class="empty">No matches found</div>';
            return;
          }

          resultsDiv.innerHTML = results.map((r, i) => `
            <div class="result-card" style="animation-delay: ${i * 50}ms">
              <div class="result-header">
                <span class="result-index">#${r.index + 1}</span>
                <span class="result-score">${(r.score * 100).toFixed(0)}%</span>
              </div>
              <div class="result-text">${escapeHtml(r.text)}</div>
            </div>
          `).join('');
        } catch (err) {
          console.error('Search error:', err);
        }
      }, 150);
    });

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // Show initial state
    resultsDiv.innerHTML = '<div class="empty">Type to search by meaning, not just keywords</div>';

    // Initialize
    init();
  </script>
</body>
</html>
